<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квіз-картки</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@5/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/function-plot@1/dist/function-plot.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.js"></script>
</head>
<body>
  <main class="page">
    <div class="brand">formlq</div>
    <h1 class="page-title">Квіз-картки</h1>

    <section id="deckListSection" class="section-card">
      <div class="section-header">
        <span>Блоки</span>
      </div>
      <div id="deckList" class="row-list"></div>
    </section>

    <section id="sectionListSection" class="section-card" style="display: none;">
      <div class="section-header">
        <button id="btnExitSections" class="btn btn-ghost" style="padding: 8px 16px;">← Усі блоки</button>
        <span id="sectionListTitle"></span>
      </div>
      <div id="sectionList" class="row-list"></div>
    </section>

    <section id="studyView" class="study-view">
      <div class="study-top">
        <button id="btnExit" class="btn btn-ghost study-exit">← Розділи</button>
        <h2 id="studyTitle" class="study-title"></h2>
        <span id="studyProgress" class="study-progress"></span>
      </div>

      <div id="studySession">
        <div id="flipCard" class="flip-card">
          <span id="stampKnow" class="swipe-stamp stamp-know">Знаю</span>
          <span id="stampForget" class="swipe-stamp stamp-forget">Ще вчу</span>
          <div class="flip-card-inner">
            <div class="flip-card-face flip-card-front">
              <span class="face-label">Питання</span>
              <div id="cardFrontText" class="face-content"></div>
              <div id="cardFrontGraph" class="graph-box"></div>
            </div>
            <div class="flip-card-face flip-card-back">
              <span class="face-label">Відповідь</span>
              <div id="cardBackText" class="face-content"></div>
              <div id="cardBackGraph" class="graph-box"></div>
            </div>
          </div>
        </div>

        <p id="studyHint" class="study-hint">Клікни картку, щоб перегорнути · після відповіді — свайпни вправо «Знаю» / вліво «Ще вчу»</p>

        <div id="ratingControls" class="study-controls" style="display: none;">
          <button id="btnDontKnow" class="btn btn-ghost btn-rate">🔁 Ще вчу</button>
          <button id="btnKnow" class="btn btn-rate btn-know">✅ Знаю</button>
        </div>
      </div>

      <div id="studyComplete" class="study-complete" style="display: none;">
        <div class="complete-emoji">🎉</div>
        <h2 class="complete-title">Розділ вивчено!</h2>
        <div class="complete-stats">
          <div class="stat-box">
            <span id="statCards" class="stat-number"></span>
            <span class="stat-label">карток</span>
          </div>
          <div class="stat-box">
            <span id="statReviews" class="stat-number"></span>
            <span class="stat-label">повторень</span>
          </div>
          <div class="stat-box">
            <span id="statMistakes" class="stat-number"></span>
            <span class="stat-label">виправлено</span>
          </div>
        </div>
        <div class="toolbar" style="justify-content: center;">
          <button id="btnRestartSession" class="btn btn-ghost">🔁 Повторити ще раз</button>
          <button id="btnBackToSections" class="btn">← Інші розділи</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/crypto.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
